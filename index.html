<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stock Scanner Pro - High Speed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        #reader { width: 100% !important; border: none !important; border-radius: 2rem; overflow: hidden; position: relative; }
        #reader video { object-fit: cover; border-radius: 2rem; }
        /* ซ่อน UI ส่วนเกินของ Library */
        #reader__dashboard_section_csr, #reader__status_span { display: none !important; }
        
        /* เส้นเลเซอร์สมจริงสำหรับเล็งบาร์โค้ด */
        .laser-line {
            position: absolute;
            top: 50%;
            left: 10%;
            right: 10%;
            height: 2px;
            background-color: #ef4444;
            box-shadow: 0 0 10px #ef4444;
            z-index: 10;
            animation: scan 2s infinite;
        }
        @keyframes scan {
            0%, 100% { transform: translateY(-30px); opacity: 0.5; }
            50% { transform: translateY(30px); opacity: 1; }
        }
    </style>
</head>
<body class="bg-slate-900 min-h-screen text-slate-100 font-sans">

    <div class="max-w-md mx-auto p-4 pb-20">
        <header class="text-center py-8">
            <h1 class="text-2xl font-black italic tracking-tighter text-indigo-400">FAST SCAN V2</h1>
            <p class="text-slate-500 text-[10px] font-bold tracking-[0.2em]">HIGH-PERFORMANCE INVENTORY</p>
        </header>

        <!-- กล่องสแกนเนอร์ -->
        <div class="relative bg-slate-800 rounded-[2.5rem] p-3 shadow-2xl border border-slate-700 mb-6">
            <div id="setup-view" class="py-16 text-center">
                <button onclick="startScanner()" class="bg-indigo-500 hover:bg-indigo-600 text-white px-10 py-4 rounded-2xl font-black shadow-xl active:scale-95 transition-all">
                    OPEN CAMERA
                </button>
            </div>

            <div id="scanner-view" class="hidden relative">
                <div id="reader"></div>
                <div class="laser-line"></div>
            </div>
        </div>

        <!-- รายละเอียดสินค้า (Result) -->
        <div id="result-card" class="hidden bg-white rounded-[2rem] p-6 text-slate-900 animate-in fade-in slide-in-from-bottom-5 duration-500">
            <div class="flex justify-between items-start mb-6">
                <div class="flex-1">
                    <h2 id="p-name" class="text-2xl font-black leading-tight">Product Name</h2>
                    <p id="p-barcode" class="text-slate-400 font-mono text-xs italic">Barcode: -</p>
                </div>
                <div class="text-right">
                    <p id="p-price" class="text-3xl font-black text-indigo-600 tracking-tighter">฿0</p>
                </div>
            </div>

            <div class="bg-slate-100 p-4 rounded-2xl mb-4 flex justify-between items-center">
                <span class="font-bold text-slate-500">Stock:</span>
                <span id="p-stock" class="text-3xl font-black text-indigo-600">0</span>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button onclick="updateStock('out')" class="bg-rose-500 text-white py-4 rounded-2xl font-black active:scale-90 transition-all">-1 SELL</button>
                <button onclick="updateStock('in')" class="bg-indigo-600 text-white py-4 rounded-2xl font-black active:scale-90 transition-all">+1 STOCK</button>
            </div>
        </div>

        <!-- ฟอร์มสินค้าใหม่ -->
        <div id="add-form" class="hidden bg-emerald-50 rounded-[2rem] p-6 text-slate-900 mt-4 border-2 border-emerald-200">
            <h3 class="text-lg font-black mb-4 flex items-center">
                <span class="mr-2">🆕</span> NEW PRODUCT
            </h3>
            <div class="space-y-3">
                <input type="text" id="new-name" class="w-full rounded-xl px-4 py-3 border-none ring-1 ring-emerald-200 font-bold" placeholder="ชื่อสินค้า">
                <div class="grid grid-cols-2 gap-3">
                    <input type="number" id="new-price" class="w-full rounded-xl px-4 py-3 border-none ring-1 ring-emerald-200 font-bold" placeholder="ราคา (฿)">
                    <input type="number" id="new-stock" class="w-full rounded-xl px-4 py-3 border-none ring-1 ring-emerald-200 font-bold" placeholder="สตอกแรก">
                </div>
                <button onclick="submitNewProduct()" class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-black shadow-lg">SAVE DATA</button>
            </div>
        </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="hidden fixed inset-0 bg-slate-900/90 backdrop-blur-sm flex items-center justify-center z-50">
        <div class="text-center">
            <div class="w-12 h-12 border-4 border-indigo-400 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
            <p class="text-xs font-black tracking-widest text-indigo-400">WORKING...</p>
        </div>
    </div>

    <script>
        // *** วาง URL ของคุณที่นี่ ***
        const API_URL = "https://script.google.com/macros/s/AKfycbxaSGPtH9xTRWMKfZ99K2XpeXeg8DBRr5I3TFjJkUetBq3h-fj5Kz7_T_z7o_izCMHVyQ/exec";
        
        let html5QrCode;
        let lastScannedCode = "";

        async function startScanner() {
            document.getElementById('setup-view').classList.add('hidden');
            document.getElementById('scanner-view').classList.remove('hidden');

            html5QrCode = new Html5Qrcode("reader");
            
            // การตั้งค่าสำหรับการสแกนบาร์โค้ดที่มีความไวสูง
            const config = { 
                fps: 25, // เพิ่ม Frame rate ให้สูงขึ้นเพื่อการจับภาพที่ต่อเนื่อง
                qrbox: { width: 320, height: 120 }, // ปรับช่องสแกนให้เป็นแนวยาวตามรูปทรงบาร์โค้ด
                aspectRatio: 1.0,
                experimentalFeatures: {
                    useBarCodeDetectorIfSupported: true // ใช้ชิปสแกนในตัวเครื่องถ้ามี
                }
            };

            try {
                await html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess);
            } catch (err) {
                alert("Camera Error: " + err);
                location.reload();
            }
        }

        function onScanSuccess(decodedText) {
            if (decodedText === lastScannedCode) return;
            lastScannedCode = decodedText;
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]); // สั่นแบบมืออาชีพ
            fetchProduct(decodedText);
        }

        async function fetchProduct(barcode) {
            showLoading(true);
            document.getElementById('result-card').classList.add('hidden');
            document.getElementById('add-form').classList.add('hidden');

            try {
                const response = await fetch(`${API_URL}?action=check&barcode=${barcode}`);
                const data = await response.json();
                
                if (data.status === "success") {
                    document.getElementById('p-name').innerText = data.name || "ไม่มีชื่อสินค้า";
                    document.getElementById('p-barcode').innerText = `ID: ${data.barcode}`;
                    document.getElementById('p-price').innerText = `฿${data.price || 0}`;
                    document.getElementById('p-stock').innerText = data.stock || 0;
                    document.getElementById('result-card').classList.remove('hidden');
                } else {
                    document.getElementById('add-form').classList.remove('hidden');
                }
            } catch (err) { alert("API Connection Error"); }
            showLoading(false);
        }

        async function updateStock(type) {
            showLoading(true);
            try {
                const response = await fetch(`${API_URL}?action=update&barcode=${lastScannedCode}&type=${type}&amount=1`);
                const data = await response.json();
                if (data.status === "success") document.getElementById('p-stock').innerText = data.new_stock;
            } catch (err) { alert("Update Failed"); }
            showLoading(false);
        }

        async function submitNewProduct() {
            const name = document.getElementById('new-name').value;
            const price = document.getElementById('new-price').value;
            const stock = document.getElementById('new-stock').value;
            if (!name) return alert("ระบุชื่อสินค้าด้วยครับ");

            showLoading(true);
            try {
                const url = `${API_URL}?action=add&barcode=${lastScannedCode}&name=${encodeURIComponent(name)}&price=${price}&stock=${stock}`;
                const res = await fetch(url);
                const data = await res.json();
                if (data.status === "success") {
                    document.getElementById('add-form').classList.add('hidden');
                    fetchProduct(lastScannedCode);
                }
            } catch (e) { alert("Save Failed"); }
            showLoading(false);
        }

        function showLoading(show) {
            document.getElementById('loading').classList.toggle('hidden', !show);
        }
    </script>
</body>
</html>
